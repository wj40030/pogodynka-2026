App\Entity\Measurement:
    properties:
        location:
            - NotBlank:
                message: 'Wybierz lokalizację.'
                groups: [create, edit]
        date:
            - NotBlank:
                message: 'Podaj datę pomiaru.'
                groups: [create, edit]
        celsius:
            - NotBlank:
                message: 'Podaj temperaturę.'
                groups: [create, edit]
            - Range:
                min: -999
                max: 999
                notInRangeMessage: 'Temperatura musi być od {{ min }} do {{ max }}.'
                groups: [create, edit]

App\Entity\Location:
    properties:
        city:
            - NotBlank:
                message: 'Podaj nazwę miasta.'
                groups: [create, edit]
            - Length:
                max: 255
                maxMessage: 'Nazwa miasta może mieć maksymalnie {{ limit }} znaków.'
                groups: [create, edit]
        latitude:
            - NotBlank:
                message: 'Podaj szerokość geograficzną.'
                groups: [create, edit]
            - Range:
                min: -90
                max: 90
                notInRangeMessage: 'Szerokość geograficzna musi być od {{ min }} do {{ max }}.'
                groups: [create, edit]
        longitude:
            - NotBlank:
                message: 'Podaj długość geograficzną.'
                groups: [create, edit]
            - Range:
                min: -90
                max: 90
                notInRangeMessage: 'Długość geograficzna musi być od {{ min }} do {{ max }}.'
                groups: [create, edit]
